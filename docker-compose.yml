services:
  auth:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["node", "backend/auth/server.js"]
    environment:
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET en .env}
      AUTH_DB: /data/auth.sqlite
      ADMIN_USER_IDS: "${ADMIN_USER_IDS:-}"
      STAFF_USER_IDS: "${STAFF_USER_IDS:-}"
    volumes:
      - auth_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    init: true
    restart: unless-stopped

  reservas:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["node", "backend/reservations/server.js"]
    environment:
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET en .env}
      RESERVATIONS_DB: /data/reservas.sqlite
    volumes:
      - reservas_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    init: true
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend
    environment:
      AUTH_URL: http://auth:3001
      RESERVATIONS_URL: http://reservas:3002
    depends_on:
      auth:
        condition: service_healthy
      reservas:
        condition: service_healthy
    ports:
      - "3000:3000"
    init: true
    restart: unless-stopped

  migracion:
    profiles: ["migracion"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["node", "backend/migrate.js", "/backup/resort.sqlite"]
    environment:
      AUTH_DB: /auth/auth.sqlite
      RESERVATIONS_DB: /reservas/reservas.sqlite
    volumes:
      - auth_data:/auth
      - reservas_data:/reservas
      - ./backups:/backup:ro

volumes:
  auth_data:
  reservas_data:
